<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>如何培养认真严谨的习惯</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            font-size: 48px;
            color: #888;
            margin-bottom: 20px;
        }
        h1 span {
            color: #0066cc;
        }
        .meta {
            text-align: center;
            color: #4488cc;
            font-size: 20px;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .img-wrap {
            flex: 1;
        }
        .img-wrap img {
            width: 100%;
            display: block;
        }
        .content {
            flex: 2;
            font-size: 24px;
            line-height: 2;
        }
        .content li {
            list-style: none;
            margin-bottom: 15px;
        }
        .content li::before {
            content: "♠";
            margin-right: 10px;
            color: black;
        }
        .red {
            color: red;
        }
    </style>
</head>
<body>
    <h1>如何培养<span>认真严谨</span>的习惯</h1>
    <div class="meta">时间:2022年02月21日17时26分 &nbsp;&nbsp; 来源:思政教育</div>
    <div class="container">
        <div class="img-wrap">
            <img src="bg.jpg" alt="">
        </div>
        <ul class="content">
            <li>反复确认，做任何事情都要照顾到每一个细节并反复确认，<span class="red">要有一种能在脑子里‘虚拟’整个事件过程的能力，</span>确保所有的节点都正常。</li>
            <li>想尽办法努力让不可能变为可能<span class="red">只有佣金全力做了，才算是努力</span></li>
            <li>结果导向一切以结果为导向，<span class="red">任何事情都是你的名片。</span>还要思考你的结果和过程是否满足所有和你配合的人的需求,</li>
            <li>学会假设<span class="red">了解周围比你强的人，观察他们的做事方法。</span>遇到让自己束手无策的时候，把自己虚拟成他的样子，想想他会怎么做</li>
        </ul>
    </div>
</body>
</html>
