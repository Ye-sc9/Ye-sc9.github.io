<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频播放按钮</title>
  <style>
   
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      
      background: linear-gradient(180deg, #5a3e6f 0%, #b88ea9 50%, #5a3e6f 100%);
    }

    
    .player-card {
      width: 280px;
      height: 280px;
      background-color: #7c4b7c;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    
    .video-frame {
      width: 220px;
      height: 160px;
      background-color: #2b1b2b;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    
      background: linear-gradient(135deg, #f5a98f 0%, #a85b6b 100%);
    }

    
    .play-button {
      width: 80px;
      height: 80px;
      background-color: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    
    .play-triangle {
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 30px solid #2b1b2b;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="video-frame">
      <div class="play-button">
        <div class="play-triangle"></div>
      </div>
    </div>
  </div>
</body>
</html>
